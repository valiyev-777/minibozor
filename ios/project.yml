# XcodeGen spec. If you'd rather not use the checked-in .xcodeproj:
#   brew install xcodegen && xcodegen generate
name: MiniBozor
options:
  bundleIdPrefix: uz.minibozor
  # uz is the base; the other two live in ru.lproj and en.lproj
  developmentLanguage: uz
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  MiniBozor:
    type: application
    platform: iOS
    sources:
      - path: MiniBozor
    info:
      path: MiniBozor/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.minibozor
        PRODUCT_NAME: Mini Bozor
        INFOPLIST_FILE: MiniBozor/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
