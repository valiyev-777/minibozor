[project]
name = "minibozor-api"
version = "0.1.0"
description = "Mini Bozor marketplace API (FastAPI) for the Android and iOS apps"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    # Decoding an upload is the only way to know it is a picture, and
    # re-encoding it is the only way to know it is one we wrote. See
    # app/images.py.
    "pillow>=10.4",
    # Schema changes. `SQLModel.metadata.create_all` creates a table that is
    # missing and never alters one that exists, so every column change up to
    # now was a hand-written ALTER — and nothing compared the result against
    # the models. See alembic/README and the parity test in the suite.
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]
# Postgres. `psycopg` (v3), not `psycopg2`: the URL scheme is
# `postgresql+psycopg://`, and the `[binary]` extra ships the libpq wheel so
# there is nothing to compile and no system package to install. An extra
# rather than a hard dependency — a SQLite-only development machine should
# not have to build or download a Postgres driver to run the tests.
postgres = ["psycopg[binary]>=3.2"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Autogenerated migrations are Alembic's formatting, not ours: one long
# `sa.Column(...)` per line, imports in the template's order. Reformatting
# them would mean re-editing every file the tool writes, for ever, and a
# migration is read as a record of what happened rather than as code somebody
# maintains. `alembic/env.py` is hand-written and is linted.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI puts Depends()/Query() in defaults by design

[tool.pytest.ini_options]
pythonpath = ["."]
