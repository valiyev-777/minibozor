# Postgres for the API. Nothing else — the app itself runs from the venv on
# the host, the way it always has, and this file exists so that "does it work
# on Postgres" is a question anybody can answer in one command.
#
#     cp .env.example .env      # and set MB_POSTGRES_PASSWORD
#     docker compose up -d
#
# The password is read from `.env` and is not in this file. `.env` is
# gitignored; this file is committed, and a committed password is a password
# for ever — it survives in the history after somebody "changes" it, and it is
# the same one on every machine that cloned the repository. Compose substitutes
# `${...}` from `.env` in this directory automatically.
#
# `:?` rather than a default: an unset password should stop the container
# coming up with a message naming the variable, not start one that anybody on
# the network can connect to.

services:
  db:
    image: postgres:16-alpine
    container_name: minibozor_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MB_POSTGRES_DB:-minibozor}
      POSTGRES_USER: ${MB_POSTGRES_USER:-minibozor}
      POSTGRES_PASSWORD: ${MB_POSTGRES_PASSWORD:?set MB_POSTGRES_PASSWORD in backend/.env}
      # Postgres compares and sorts text by the collation the cluster was
      # initialised with, and that decision cannot be changed afterwards
      # without recreating it. Pinned so that every machine sorts the
      # catalogue the same way — `ORDER BY name` over Uzbek and Russian titles
      # is not the same answer under C as under a UTF-8 locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      # 5434 on the host: 5432 and 5433 are commonly already taken by another
      # project's database, and discovering that by connecting to the wrong
      # one is worse than picking a free port. Override with MB_POSTGRES_PORT.
      - "${MB_POSTGRES_PORT:-5434}:5432"
    volumes:
      - minibozor_pgdata:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` answers as soon as the socket accepts, which during first
      # boot happens once while initdb sets up and then again for real. The
      # start_period covers that first window so a `depends_on` cannot latch
      # onto it.
      test: ["CMD-SHELL", "pg_isready -U ${MB_POSTGRES_USER:-minibozor} -d ${MB_POSTGRES_DB:-minibozor}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  minibozor_pgdata:
