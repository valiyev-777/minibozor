<!doctype html>
<!-- Three classes, each a deliberate variant of the shared system:
       density-comfortable  18px body, 64px targets — outdoors, one thumb, gloves
       allow-dark           the phone switches at dusk and is usually right
       no-select            a long-press on a stop must not put a selection
                            handle over the button being reached for -->
<html lang="uz" class="density-comfortable allow-dark no-select">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit and user-scalable: a courier reads this in sunlight and will
      pinch to zoom a house number. Nothing here is laid out so tightly that
      zooming breaks it, so zooming is left alone.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>MiniBozor Kuryer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
