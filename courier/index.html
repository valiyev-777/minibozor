<!doctype html>
<!-- density-comfortable: outdoors, one thumb, sometimes a glove, sometimes in
     direct sun. 18px body and a 64px primary action, from the shared tokens —
     the reason those numbers are what they are is in shared/theme.css. -->
<html lang="uz" class="density-comfortable no-select allow-dark">
  <head>
    <meta charset="UTF-8" />
    <!-- No zoom, and `viewport-fit=cover` so the page can paint under the
         notch while `.pb-safe` keeps the primary action above the home
         indicator. A courier zooming by accident with a parcel in one hand is
         a courier who has lost the button. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1d4ed8" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Mini Bozor · Kuryer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
